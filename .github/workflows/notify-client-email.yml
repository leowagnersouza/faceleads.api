name: Send Email on Commit

on:
  push:
    branches:
      - main
      - develop

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract commit info
        id: commit-info
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          COMMIT_DATE=$(git log -1 --pretty=%ai)
          COMMIT_SHA=$(git log -1 --pretty=%h)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          
          echo "message=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          echo "author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "date=$COMMIT_DATE" >> $GITHUB_OUTPUT
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          # Gmail SMTP
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_SENDER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Novo commit no repositório faceleads"
          to: leowsouza@outlook.com.br,gabriela@mmadben.com.br
          from: ${{ secrets.EMAIL_SENDER }}
          body: |
            Novo commit realizado no repositório faceleads!
            
            📌 Branch: ${{ steps.commit-info.outputs.branch }}
            👤 Autor: ${{ steps.commit-info.outputs.author }}
            📅 Data: ${{ steps.commit-info.outputs.date }}
            🔗 Commit: ${{ steps.commit-info.outputs.sha }}
            
            📝 Mensagem do commit:
            ${{ steps.commit-info.outputs.message }}
            
            ---
            Repositório: ${{ github.repository }}
            Link: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
